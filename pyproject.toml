[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relay-transfer"
version = "0.1.0"
description = "Direct local file transfer for Windows devices"
readme = "PRODUCT.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.7.4",
  "cryptography>=42.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pillow>=10.3.0",
  "python-multipart>=0.0.9",
  "qrcode>=7.4.2",
  "uvicorn>=0.30.0",
  "zeroconf>=0.132.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-qrcode>=7.4.0",
]

[project.scripts]
relay = "relay.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"relay/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
ignore_errors = true
