<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ff">
  <title>Relay — Kết nối điện thoại</title>
  <link rel="stylesheet" href="/static/phone.css?v={{ static_version }}">
</head>
<body>
  <header class="phone-header"><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span>Relay</div></header>
  <main class="connect-page">
    <div class="connect-symbol" aria-hidden="true">↕</div>
    <h1>Kết nối với {{ device_name }}</h1>
    <p>Kiểm tra đây là máy tính của bạn và hai thiết bị dùng chung Wi-Fi.</p>
    <form class="card connect-card" action="/phone/connect" method="post">
      <input type="hidden" name="invite" value="{{ invite }}">
      <button class="primary" type="submit">Kết nối với Relay</button>
      <span>Bạn có thể gửi ảnh lên máy tính và tải tệp về điện thoại. Kết nối hết hạn sau một giờ.</span>
    </form>
  </main>
</body>
</html>
